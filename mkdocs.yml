site_name: IPS Wiki
site_description: Wiki for interacting particle systems, spin systems, ergodicity, and related research.
site_author: Maciej Głuchowski
repo_url: https://github.com/maciejgluchowski86-beep/ips-wiki
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.highlight
    - content.code.copy

