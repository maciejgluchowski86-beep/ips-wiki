site_name: IPS Wiki
site_description: Wiki for interacting particle systems, spin systems, ergodicity, and related research.
site_author: Maciej Głuchowski
repo_url: https://github.com/maciejgluchowski86-beep/ips-wiki
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Core entries:
      - Lattice and graph: entries/lattice-and-graph.md
      - Polynomial-growth lattice: entries/polynomial-growth-lattice.md
      - Local functions: entries/local-functions.md
      - Monomials: entries/monomials.md
      - Bernoulli product measure: entries/bernoulli-product-measure.md
      - Interacting particle system: entries/interacting-particle-system.md
      - Spin system: entries/spin-system.md
      - Pure noise spin system: entries/pure-noise-spin-system.md
      - Oriented spin system: entries/oriented-spin-system.md
      - Invariant measure: entries/invariant-measure.md
      - Ergodicity: entries/ergodicity.md
  - Duality:
      - Duality: entries/duality.md
      - Monomial duality for spin systems: entries/monomial-duality-for-spin-systems.md
      - Duality noise lemma: entries/duality-noise-lemma.md
  - Signed additive set processes:
      - Signed additive set process: entries/signed-additive-set-process.md
      - Graphical construction of signed additive set process: entries/graphical-construction-of-signed-additive-set-process.md
      - Successful interaction: entries/successful-interaction.md
  - Patches:
      - Patch: entries/patch.md
      - Interaction cone: entries/interaction-cone.md
      - Patch consistency event: entries/patch-consistency-event.md
      - Patch factorization: entries/patch-factorization.md
      - Patch contribution: entries/patch-contribution.md
      - Patch positivity property: entries/patch-positivity-property.md
      - Patch critical density: entries/patch-critical-density.md
      - High-density measure: entries/high-density-measure.md
      - Patch representation of spin systems: entries/patch-representation-of-spin-systems.md
      - Undoing duality under confined interactions: entries/undoing-duality-under-confined-interactions.md
      - Finite propagation for zero-boundary restrictions: entries/finite-propagation-for-zero-boundary-restrictions.md
      - Exponential relaxation under confined late interactions: entries/exponential-relaxation-under-confined-late-interactions.md
      - Monomial monotonicity for high-density measures: entries/monomial-monotonicity-for-high-density-measures.md
      - Pure-death comparison under patch positivity: entries/pure-death-comparison-under-patch-positivity.md
      - Common invariant limit under uniform pure deaths: entries/common-invariant-limit-under-uniform-pure-deaths.md
  - KCSM:
      - Bernoulli refresh operator: entries/bernoulli-refresh-operator.md
      - Update family: entries/update-family.md
      - Kinetically constrained spin model: entries/kinetically-constrained-spin-model.md
      - Soft KCSM: entries/soft-kcsm.md
      - Legal update: entries/legal-update.md
      - Monomial duality for FA-1f: entries/monomial-duality-for-fa-1f.md
      - Patch contributions for FA-1f: entries/patch-contributions-for-fa-1f.md
      - Patch positivity for FA-1f: entries/patch-positivity-for-fa-1f.md
      - Patch critical density for FA-1f: entries/patch-critical-density-for-fa-1f.md
      - Monomial duality for BABP: entries/monomial-duality-for-babp.md
      - Patch contributions for BABP: entries/patch-contributions-for-babp.md
      - Patch positivity for BABP: entries/patch-positivity-for-babp.md
      - Patch critical density for BABP: entries/patch-critical-density-for-babp.md
      - KCSM relaxation and mixing: entries/kcsm-relaxation-and-mixing.md
      - KCSM out of equilibrium: entries/kcsm-out-of-equilibrium.md
  - Models:
      - FA-1f model: entries/fa-1f-model.md
      - East model: entries/east-model.md
      - Biased annihilating branching process: entries/babp-model.md
  - Out of equilibrium:
      - FA-1f out of equilibrium: entries/fa-1f-out-of-equilibrium.md
      - East out of equilibrium: entries/east-out-of-equilibrium.md
      - BABP out of equilibrium: entries/babp-out-of-equilibrium.md
      - Chronology-averaged sign route for one-dimensional FA-1f: entries/chronology-averaged-sign-route-for-fa-1f.md
  - PDE and branching representations:
      - Heat-reference fully nonlinear terminal PDE: entries/heat-reference-fully-nonlinear-pde.md
      - Mild formulation and branching-diffusion representation: entries/mild-formulation-and-branching-diffusion-representation.md
      - Marked branching diffusion for gradient nonlinearities: entries/marked-branching-diffusion-for-gradient-nonlinearities.md
      - Antithetic and ghost branching schemes: entries/antithetic-and-ghost-branching-schemes.md
      - Nguwi-Penent-Privault coding tree: entries/npp-coding-tree.md
      - Nguwi-Penent-Privault coding-tree Feynman-Kac theorem: entries/npp-coding-tree-feynman-kac-theorem.md
      - Directional jet radius: entries/directional-jet-radius.md
      - Repeated-Hessian obstruction for coding trees: entries/repeated-hessian-obstruction-for-coding-trees.md
      - Finite directional radius obstruction: entries/finite-directional-radius-obstruction.md
      - Gevrey-1/2 necessity for coding trees: entries/gevrey-half-necessity-for-coding-trees.md
      - Integrable regime of the coding tree: entries/integrable-regime-of-coding-tree.md
  - Meta:
      - Notation: meta/notation.md
      - Style decisions: meta/style-decisions.md
      - Entry template: meta/entry-template.md
      - References: meta/references.md

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
