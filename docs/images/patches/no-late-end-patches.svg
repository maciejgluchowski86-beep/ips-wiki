<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">No late successful interactions</title><desc id="desc">End patches at horizon t all contain the interval from T to t when no successful interaction occurs after T.</desc><rect width="800" height="360" fill="white"/>
<g stroke="#333" stroke-width="1.2"><line x1="120" y1="320" x2="120" y2="40"/><line x1="240" y1="320" x2="240" y2="40"/><line x1="360" y1="320" x2="360" y2="40"/><line x1="480" y1="320" x2="480" y2="40"/><line x1="600" y1="320" x2="600" y2="40"/></g>
<g fill="#ddd"><rect x="100" y="80" width="40" height="240"/><rect x="220" y="135" width="40" height="185"/><rect x="340" y="105" width="40" height="215"/><rect x="460" y="160" width="40" height="160"/><rect x="580" y="120" width="40" height="200"/></g>
<line x1="70" y1="145" x2="660" y2="145" stroke="#555" stroke-width="2" stroke-dasharray="9 7"/><line x1="70" y1="55" x2="660" y2="55" stroke="#111" stroke-width="2"/><g font-family="sans-serif" font-size="16"><text x="670" y="150">T</text><text x="670" y="60">t</text><text x="185" y="32">no successful interactions in (T,t]</text><text x="176" y="338">every end patch contains [T,t]</text></g></svg>
