name: Integrator strict wiki check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  strict-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Repository-wide Markdown link check and counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          broken = []
          link_re = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          for src in (root / 'docs').rglob('*.md'):
              text = src.read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  dest = raw.strip().split()[0].strip('<>')
                  if not dest or dest.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  dest = dest.split('#', 1)[0].split('?', 1)[0]
                  if not dest.endswith('.md'):
                      continue
                  target = (src.parent / dest).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      broken.append((src.relative_to(root), raw, 'outside repository'))
                      continue
                  if not target.is_file():
                      broken.append((src.relative_to(root), raw, str(target.relative_to(root))))

          entries = list((root / 'docs' / 'entries').glob('*.md'))
          proved = 0
          audited = 0
          for path in entries:
              text = path.read_text(encoding='utf-8')
              proved += bool(re.search(r'^status:\s*proved here\s*$', text, re.M))
              audited += bool(re.search(r'^audit:\s*current\s*$', text, re.M))

          print(f'LIVE_ENTRY_COUNT={len(entries)}')
          print(f'PROVED_HERE_COUNT={proved}')
          print(f'AUDIT_CURRENT_COUNT={audited}')
          if broken:
              print('Broken relative Markdown links:')
              for item in broken:
                  print(' :: '.join(map(str, item)))
              sys.exit(1)
          print('REPOSITORY_WIDE_LINK_CHECK=PASS')
          PY

      - name: Check live wiki quality metadata
        run: python scripts/check_wiki_quality.py --changed-from HEAD^

      - name: Strict MkDocs build
        run: mkdocs build --strict
