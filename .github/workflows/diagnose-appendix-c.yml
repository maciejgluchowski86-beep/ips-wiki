name: Export paper diagnostic bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-appendix-c.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/paper/figures/rendered bundle/paper/sections
          cp paper-revision.tex bundle/
          cp ejpecp.cls bundle/
          cp paper/preamble.tex bundle/paper/
          cp paper/references.bib bundle/paper/
          cp paper/amsplain-fullnames.bst bundle/paper/
          cp paper/sections/patch-interior-figure.tex bundle/paper/sections/
          cp paper/figures/rendered/*.pdf bundle/paper/figures/rendered/
      - uses: actions/upload-artifact@v4
        with:
          name: appendix-c-diagnostic-bundle
          path: bundle
