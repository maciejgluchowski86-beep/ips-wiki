name: Compile paper revision debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable PK font generation
        shell: bash
        run: |
          set +e
          MKTEXPK=0 timeout 25s pdflatex -file-line-error -interaction=nonstopmode -halt-on-error paper-revision.tex > pkoff.stdout 2>&1
          code=$?
          echo "EXIT=$code"
          echo "===== FONT / MKTEX MESSAGES ====="
          grep -Eai 'mktex|mf-nowin|metafont|font|pk' pkoff.stdout | tail -n 250 || true
          echo "===== TAIL ====="
          tail -n 120 pkoff.stdout || true
          exit $code
