name: Compile paper revision debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
      - name: One pdflatex pass with timeout
        shell: bash
        run: |
          set +e
          timeout 90s pdflatex -file-line-error -interaction=nonstopmode -halt-on-error paper-revision.tex > pdflatex.stdout 2>&1
          code=$?
          echo "PDFLATEX_EXIT_CODE=$code"
          echo "===== STDOUT TAIL ====="
          tail -n 250 pdflatex.stdout || true
          echo "===== LOG TAIL ====="
          tail -n 250 paper-revision.log || true
          exit $code
