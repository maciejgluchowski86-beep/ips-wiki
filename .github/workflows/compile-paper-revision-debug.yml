name: Compile paper revision debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
      - name: Make no-figure diagnostic copy
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s = open('paper-revision.tex').read()
          s = re.sub(r'\\input\{paper/figures/[^}]+\}', r'\\mbox{[figure omitted for timing]}', s)
          s = s.replace(r'\input{paper/sections/patch-interior-figure}', r'\mbox{[figure omitted for timing]}')
          open('paper-nofig.tex','w').write(s)
          PY
      - name: Time one no-figure pdflatex pass
        shell: bash
        run: |
          set +e
          /usr/bin/time -f 'WALL=%e USER=%U SYS=%S' \
            timeout 70s pdflatex -file-line-error -interaction=nonstopmode -halt-on-error paper-nofig.tex \
            > nofig.stdout 2> nofig.time
          code=$?
          echo "NOFIG_EXIT=$code"
          cat nofig.time
          tail -n 60 nofig.stdout || true
          exit $code
