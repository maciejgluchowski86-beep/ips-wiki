name: Compile paper revision debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace pdflatex subprocesses
        shell: bash
        run: |
          set +e
          timeout 45s strace -f -tt -T -e trace=process -o process.trace \
            pdflatex -file-line-error -interaction=nonstopmode -halt-on-error paper-revision.tex \
            > pdflatex.stdout 2>&1
          code=$?
          echo "EXIT_CODE=$code"
          echo "===== PROCESS TRACE ====="
          cat process.trace || true
          echo "===== PDFLATEX TAIL ====="
          tail -n 80 pdflatex.stdout || true
          exit $code
