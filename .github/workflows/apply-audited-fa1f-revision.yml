name: Apply audited FA-1f revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-audited-fa1f-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revise paper source
        env:
          REPLACEMENT_B64: 'XHN1YnN1YnNlY3Rpb257UGF0Y2ggcG9zaXRpdml0eSBhbmQgY3JpdGljYWwgZGVuc2l0eX0KXGxhYmVse3N1YnN1YnNlYzpmYS0xZi1wYXRjaGVzfQoKV3JpdGV+JHA9MS1xJCBhbmQgYXNzdW1lIHRoYXR+JE4oaSlcbmVxXHZuJCBmb3IgZXZlcnl+JGlcaW5cTGFtYmRhJC4gUmVjYWxsIHRoYXQKRkEtMWYgaGFzIGdlbmVyYXRvcgpcYmVnaW57ZXF1YXRpb24qfQpcTGN    '
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("paper/main.tex")
          text = path.read_text()
          start_marker = r"\mg{This is very ugly."
          end_marker = r"\end{remark}"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode()
          revised = text[:start] + replacement + "\n" + text[end:]
          if r"\mg{ This theorem looks visually bad}" in revised:
              raise RuntimeError("The visual revision note was not removed")
          path.write_text(revised)
          PY
      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex
          git rm .github/workflows/apply-audited-fa1f-revision.yml
          git commit -m "Revise FA-1f patch positivity application"
          git push origin HEAD:main
