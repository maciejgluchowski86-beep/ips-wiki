name: Integrator temporary check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run wiki quality gate
        run: python scripts/check_wiki_quality.py --changed-from HEAD^

      - name: Enumerate repository and grep Markdown links
        run: |
          git ls-files
          git grep -nE '\]\([^)]*\.md(#[^)]*)?\)' -- '*.md' || true

      - name: Count live-entry metadata and inspect relative Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import unquote, urlsplit

          tracked = subprocess.check_output(['git', 'ls-files', '*.md'], text=True).splitlines()
          entries = sorted(Path('docs/entries').glob('*.md'))
          proved_here = 0
          audit_current = 0
          for path in entries:
              text = path.read_text(encoding='utf-8')
              head = text.split('---', 2)[1] if text.startswith('---') and text.count('---') >= 2 else ''
              if re.search(r'(?m)^status:\s*proved here\s*$', head):
                  proved_here += 1
              if re.search(r'(?m)^audit:\s*current\s*$', head):
                  audit_current += 1

          print(f'LIVE_ENTRY_COUNT={len(entries)}')
          print(f'PROVED_HERE_COUNT={proved_here}')
          print(f'AUDIT_CURRENT_COUNT={audit_current}')
          print(f'::notice title=Live entry count::{len(entries)}')
          print(f'::notice title=Proved here count::{proved_here}')
          print(f'::notice title=Audit current count::{audit_current}')

          # This intentionally scans every tracked Markdown file. Strip fenced code first
          # so literal examples are not misclassified as links. Root-relative site links
          # are left to MkDocs; relative filesystem links are checked against the tree.
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          fence_re = re.compile(r'(?ms)^```.*?^```\s*$|^~~~.*?^~~~\s*$')
          broken = []
          for name in tracked:
              source = Path(name)
              text = fence_re.sub('', source.read_text(encoding='utf-8'))
              for raw in link_re.findall(text):
                  raw = raw.strip()
                  if raw.startswith('<') and raw.endswith('>'):
                      raw = raw[1:-1]
                  target = raw.split()[0]
                  if target.startswith('#') or target.startswith('/'):
                      continue
                  parts = urlsplit(target)
                  if parts.scheme or parts.netloc:
                      continue
                  path_part = unquote(parts.path)
                  if not path_part:
                      continue
                  candidate = (source.parent / path_part).resolve()
                  root = Path.cwd().resolve()
                  try:
                      relative = candidate.relative_to(root)
                  except ValueError:
                      broken.append((name, raw, 'escapes repository'))
                      continue
                  if not candidate.exists():
                      broken.append((name, raw, str(relative)))

          print(f'BROKEN_RELATIVE_MARKDOWN_LINKS={len(broken)}')
          print(f'::notice title=Broken relative Markdown links::{len(broken)}')
          for source, raw, resolved in broken:
              print(f'  {source}: {raw} -> {resolved}')
              print(f'::warning file={source},title=Broken relative Markdown link::{raw} -> {resolved}')
          PY

      - name: Strict MkDocs build
        run: mkdocs build --strict
