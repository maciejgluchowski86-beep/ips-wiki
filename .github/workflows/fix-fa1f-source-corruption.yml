name: Fix FA-1f source corruption

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-fa1f-source-corruption.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/main.tex")
          text = path.read_text()
          corrections = {
              r"\in[0,1]^Lambda$": r"\in[0,1]^\Lambda$",
              r"again~p$\mb 1$": r"again~$p\mb 1$",
              r"c_i^0(\vn)!=p,": r"c_i^0(\vn)&=p,",
              r"c_i^1(\vn)!=q,": r"c_i^1(\vn)&=q,",
              r"c_i^0(\vn)!=p+\varepsilon r_i,": r"c_i^0(\vn)=p+\varepsilon r_i,",
          }
          for old, new in corrections.items():
              if old not in text:
                  raise RuntimeError(f"Missing expected corrupted text: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex
          git rm .github/workflows/fix-fa1f-source-corruption.yml
          git commit -m "Fix FA-1f LaTeX source"
          git push origin HEAD:main
