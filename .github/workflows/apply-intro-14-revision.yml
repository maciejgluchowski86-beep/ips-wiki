name: Apply introduction revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-intro-14-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited revision
        env:
          OLD_BLOCK_B64: ''
          NEW_BLOCK_B64: ''
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('paper/main.tex')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode()
          if text.count(old) != 1:
              raise SystemExit('Expected revision block not found exactly once')
          text = text.replace(old, new)
          old_phrase = 'This class contains Bernoulli\nmeasures with sufficiently high calm-state density'
          new_phrase = 'This class contains Bernoulli\nproduct measures with sufficiently high calm-state density'
          if text.count(old_phrase) != 1:
              raise SystemExit('Expected Bernoulli phrase not found exactly once')
          path.write_text(text.replace(old_phrase, new_phrase))
          PY
          rm .github/workflows/apply-intro-14-revision.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.tex .github/workflows/apply-intro-14-revision.yml
          git commit -m 'Revise introduction main results'
          git push
