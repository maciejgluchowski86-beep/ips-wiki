name: Polish FA-1f application

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/polish-fa1f-application.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish subsection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper/main.tex")
          text = path.read_text()
          text = text.replace("a refresh-density profile", "a refresh profile")
          text = text.replace(r"$\mb p^{\star}=p\mb 1$", r"$\mb p^\star=p\mb 1$")
          text = text.replace(
              r'''$\Lcal_{\mathrm{FA}}^{\varepsilon,\mb r}$ has patch positivity if and only if
\begin{equation*}
\mb r\geq p\mb 1.
\end{equation*}
Whenever this holds, its patch critical profile is again~$p\mb 1$.''',
              r'''$\Lcal_{\mathrm{FA}}^{\varepsilon,\mb r}$ has patch positivity if and only
if~$\mb r\geq p\mb 1$. Whenever this holds, its patch critical profile is
again~$p\mb 1$.''')
          text = text.replace(
              r'''c_i^0\bb{N(i)}+c_i^1\bb{N(i)}
&=
-1
\leq
0,''',
              r'''c_i^0\bb{N(i)}+c_i^1\bb{N(i)}
&=-1\leq0,''')
          text = text.replace(
              r'''-c_i^0(\vn)c_i^1\bb{N(i)}
&=
q(-p)-p(-q)
=
0.''',
              r'''-c_i^0(\vn)c_i^1\bb{N(i)}
&=q(-p)-p(-q)=0.''')
          text = text.replace(
              r'''\begin{equation*}
c_i^0(\vn)=p+\varepsilon r_i,
\quad
c_i^1(\vn)=q+\varepsilon\bb{1-r_i}.
\end{equation*}''',
              r'''\begin{align*}
c_i^0(\vn)&=p+\varepsilon r_i,
&
c_i^1(\vn)&=q+\varepsilon\bb{1-r_i}.
\end{align*}''')
          text = text.replace(
              r'''The equality case~$\mb r=p\mb 1$ is the usual soft FA-1f perturbation. It adds
unconstrained refreshes with the reversible Bernoulli law of FA-1f and therefore has
a positive spectral gap. We do not use these standard facts below.''',
              r'''The equality case~$\mb r=p\mb 1$ is the usual soft FA-1f perturbation. It is
reversible and has spectral gap at least~$\varepsilon$ because of the unconstrained
refresh component. The applications below concern the larger class
$\mb r\geq p\mb 1$, which need not preserve the FA-1f equilibrium law.''')
          path.write_text(text)
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex
          git rm .github/workflows/polish-fa1f-application.yml
          git commit -m "Polish FA-1f application presentation"
          git push origin HEAD:main
