name: Build static paper figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static-paper-figures.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create standalone simple-IPS figure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/figures/rendered
          python3 - <<'PY'
          from pathlib import Path
          src = Path("paper/figures/simple-ips-ergodicity-regions.tex").read_text()
          src = src.replace(
              r"Corollaries 7.1 and 7.2 in~\cite{GluchowskiMenz2025}",
              "Earlier criteria",
          )
          src = src.replace(
              r"Long-lived-state criterion~\cite{GluchowskiMenz2026}",
              "Long-lived-state criterion",
          )
          src = src.replace(
              r"Corollary~\ref{cor:oriented-ergodicity}",
              "Present criterion",
          )
          Path("paper/figures/rendered/simple-ips-body.tex").write_text(src)
          PY
          cat > paper/figures/rendered/simple-ips-ergodicity-regions.tex <<'EOF'
          \documentclass[border=2pt]{standalone}
          \usepackage[T1]{fontenc}
          \usepackage{lmodern}
          \usepackage{amsmath,amssymb,graphicx}
          \input{paper/preamble}
          \begin{document}
          \input{paper/figures/rendered/simple-ips-body}
          \end{document}
          EOF

      - name: Compile simple-IPS figure
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/figures/rendered/simple-ips-ergodicity-regions.tex
          compiler: pdflatex
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit rendered PDF
        shell: bash
        run: |
          set -euo pipefail
          mv simple-ips-ergodicity-regions.pdf paper/figures/rendered/simple-ips-ergodicity-regions.pdf
          rm -f paper/figures/rendered/simple-ips-ergodicity-regions.tex \
                paper/figures/rendered/simple-ips-body.tex \
                paper/figures/rendered/*.aux \
                paper/figures/rendered/*.log \
                paper/figures/rendered/*.out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/figures/rendered/simple-ips-ergodicity-regions.pdf
          git commit -m "Precompile simple IPS parameter figure"
          git push origin HEAD:main
