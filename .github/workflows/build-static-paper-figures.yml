name: Build static paper figures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static-paper-figures.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create standalone figure wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/figures/rendered

          make_wrapper () {
            name="$1"
            src="$2"
            cat > "paper/figures/rendered/${name}.tex" <<EOF
          \documentclass[border=2pt]{standalone}
          \usepackage[T1]{fontenc}
          \usepackage{lmodern}
          \usepackage{amsmath,amssymb,graphicx}
          \input{paper/preamble}
          \begin{document}
          \input{${src}}
          \end{document}
          EOF
          }

          make_wrapper patch-geometry paper/figures/patch-geometry
          make_wrapper patch-interiors paper/figures/patch-interiors
          make_wrapper convergence-backward-xo-trail paper/figures/convergence-backward-xo-trail
          make_wrapper convergence-no-late-end-patches paper/figures/convergence-no-late-end-patches
          make_wrapper convergence-event-spatial-escape paper/figures/convergence-event-spatial-escape

      - name: Compile static figures
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/figures/rendered/patch-geometry.tex
            paper/figures/rendered/patch-interiors.tex
            paper/figures/rendered/convergence-backward-xo-trail.tex
            paper/figures/rendered/convergence-no-late-end-patches.tex
            paper/figures/rendered/convergence-event-spatial-escape.tex
          compiler: pdflatex
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit rendered PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper/figures/rendered
          for name in \
            patch-geometry \
            patch-interiors \
            convergence-backward-xo-trail \
            convergence-no-late-end-patches \
            convergence-event-spatial-escape
          do
            mv "${name}.pdf" "paper/figures/rendered/${name}.pdf"
          done
          rm -f paper/figures/rendered/*.tex \
                paper/figures/rendered/*.aux \
                paper/figures/rendered/*.log \
                paper/figures/rendered/*.out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/figures/rendered/*.pdf
          if git diff --cached --quiet; then
            echo "No rendered figure changes."
            exit 0
          fi
          git commit -m "Precompile static paper figures"
          git push origin HEAD:main
