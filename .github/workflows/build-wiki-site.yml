name: Build wiki site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check live wiki quality metadata
        run: python scripts/check_wiki_quality.py --changed-from HEAD^

      - name: Check fifth-sweep deleted basenames repository-wide
        shell: bash
        run: |
          set -euo pipefail
          basenames=(
            fa-1f-bernoulli-convergence-route-audit
            chronology-averaged-sign-route-for-fa-1f
            coarse-chronology-contraction-route-for-fa-1f
            discrepancy-zipper-route-for-fa-1f
            gap-process-route-for-fa-1f
            front-zipper-representation-for-fa-1f
            fa-1f-babp-xor-decomposition
            moving-edge-cbsep-resampling-for-fa-1f
            iterated-moving-edge-splitting-for-fa-1f
            separated-vacancy-reproduction-for-fa-1f
            regional-sweep-contraction-for-fa-1f
            tagged-vacancy-bridge-factorization-for-fa-1f
            vacancy-lens-factorization-for-fa-1f
          )
          exclusions=(":!.github/workflows/build-wiki-site.yml")
          for deleted in "${basenames[@]}"; do
            exclusions+=(":!docs/entries/$deleted.md")
          done
          failed=0
          for base in "${basenames[@]}"; do
            hits="$(git grep -n -F "$base" -- . "${exclusions[@]}" || true)"
            if [[ -n "$hits" ]]; then
              echo "Unexpected surviving reference to $base:"
              echo "$hits"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
