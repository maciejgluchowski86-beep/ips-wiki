name: Build wiki site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check live wiki quality metadata
        run: python scripts/check_wiki_quality.py --changed-from HEAD^

      - name: Report sixth-sweep references repository-wide
        shell: bash
        run: |
          set -u
          targets=(
            dichotomy-benchmark
            finite-directional-radius-obstruction
            gevrey-half-necessity-for-coding-trees
            representation-level-dichotomy
            repeated-hessian-obstruction-for-coding-trees
          )
          titles=(
            "Dichotomy benchmark"
            "Finite directional radius obstruction"
            "Gevrey-1/2 necessity for coding trees"
            "Representation-level dichotomy"
            "Repeated-Hessian obstruction for coding trees"
          )
          exclusions=(":!.github/workflows/build-wiki-site.yml")
          for base in "${targets[@]}"; do
            exclusions+=(":!docs/entries/$base.md")
          done
          found=0
          for needle in "${targets[@]}" "${titles[@]}"; do
            hits="$(git grep -n -F "$needle" -- . "${exclusions[@]}" || true)"
            if [[ -n "$hits" ]]; then
              echo "SURVIVING REFERENCE: $needle"
              echo "$hits"
              found=1
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "PREDELETE_REFERENCE_SCAN=zero"
          else
            echo "PREDELETE_REFERENCE_SCAN=nonzero"
          fi

      - name: Report wiki curation counts
        shell: bash
        run: |
          entries="$(find docs/entries -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          proved="$(grep -l '^status: proved here$' docs/entries/*.md 2>/dev/null | wc -l | tr -d ' ')"
          audited="$(grep -l '^audit: current$' docs/entries/*.md 2>/dev/null | wc -l | tr -d ' ')"
          echo "ENTRY_COUNT=$entries"
          echo "PROVED_HERE_COUNT=$proved"
          echo "AUDIT_CURRENT_COUNT=$audited"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
