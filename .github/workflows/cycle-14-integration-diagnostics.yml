name: Cycle 14 integration diagnostics

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check changed live entries
        run: python scripts/check_wiki_quality.py --changed-from HEAD^

      - name: Repository-wide Markdown link check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote

          root = Path('.').resolve()
          broken = []
          checked = 0
          pattern = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')

          for path in root.rglob('*.md'):
              if '.git' in path.parts or 'site' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for raw in pattern.findall(text):
                  target = raw.strip()
                  if target.startswith('<') and target.endswith('>'):
                      target = target[1:-1]
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:', 'data:', 'javascript:')):
                      continue
                  target = target.split('#', 1)[0].strip()
                  if not target:
                      continue
                  if ' ' in target:
                      target = target.split(' ', 1)[0]
                  target = unquote(target)
                  resolved = (path.parent / target).resolve()
                  checked += 1
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      broken.append((path.relative_to(root), raw, 'escapes repository'))
                      continue
                  if not resolved.exists():
                      broken.append((path.relative_to(root), raw, 'missing target'))

          print(f'Repository-wide local Markdown links checked: {checked}')
          if broken:
              print(f'Broken local Markdown links: {len(broken)}')
              for source, target, reason in broken:
                  print(f'- {source}: {target} ({reason})')
              sys.exit(1)
          print('Broken local Markdown links: 0')
          PY

      - name: Count live wiki metadata
        shell: bash
        run: |
          set -euo pipefail
          entries=$(git ls-files 'docs/entries/*.md' | wc -l)
          proved=$(git grep -l '^status: proved here$' -- 'docs/entries/*.md' | wc -l || true)
          audited=$(git grep -l '^audit: current$' -- 'docs/entries/*.md' | wc -l || true)
          echo "Live entries: $entries"
          echo "Status proved here: $proved"
          echo "Audit current: $audited"

      - name: Strict MkDocs build
        run: mkdocs build --strict
