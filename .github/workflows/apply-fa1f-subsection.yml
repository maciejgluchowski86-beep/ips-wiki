name: Apply FA-1f application subsection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-fa1f-subsection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply subsection and notation revision
        env:
          SPIN_BLOCK_B64: ''
          FA_BLOCK_B64: ''
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              text = path.read_text()
              i = text.index(start)
              j = text.index(end, i)
              updated = text[:i] + replacement.rstrip() + "\n\n" + text[j:]
              path.write_text(updated)

          spin = Path('paper/sections/spin-systems.tex')
          replace_between(
              spin,
              r'\subsection{Independent noise}',
              r'\subsection{Invariant measures and convergence}',
              base64.b64decode(os.environ['SPIN_BLOCK_B64']).decode(),
          )

          main = Path('paper/main.tex')
          replace_between(
              main,
              r'\subsubsection{Patch positivity and critical density}',
              r'\subsubsection{Monotonicity and noisy convergence}',
              base64.b64decode(os.environ['FA_BLOCK_B64']).decode(),
          )
          PY
          rm .github/workflows/apply-fa1f-subsection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.tex paper/sections/spin-systems.tex .github/workflows/apply-fa1f-subsection.yml
          git commit -m 'Write FA-1f patch positivity application'
          git push
