name: Cycle 18 integrator checks

on:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Count live entry metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          entries = sorted(Path('docs/entries').glob('*.md'))
          proved = 0
          audited = 0
          for path in entries:
              text = path.read_text(encoding='utf-8')
              if '\nstatus: proved here\n' in '\n' + text:
                  proved += 1
              if '\naudit: current\n' in '\n' + text:
                  audited += 1
          print(f'ENTRY_COUNT={len(entries)}')
          print(f'PROVED_HERE_COUNT={proved}')
          print(f'AUDIT_CURRENT_COUNT={audited}')
          PY

      - name: Check repository-wide Markdown relative links
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          root = Path('.').resolve()
          markdown_files = [p for p in root.rglob('*.md') if '.git' not in p.parts and 'site' not in p.parts]
          inline = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          reference = re.compile(r'^\s*\[[^\]]+\]:\s*(\S+)', re.MULTILINE)
          schemes = ('http://', 'https://', 'mailto:', 'tel:', 'javascript:', 'data:')
          failures = []
          checked = 0

          def without_fences(text: str) -> str:
              out = []
              in_fence = False
              marker = None
              for line in text.splitlines():
                  stripped = line.lstrip()
                  if stripped.startswith('```') or stripped.startswith('~~~'):
                      token = stripped[:3]
                      if not in_fence:
                          in_fence = True
                          marker = token
                      elif token == marker:
                          in_fence = False
                          marker = None
                      continue
                  if not in_fence:
                      out.append(line)
              return '\n'.join(out)

          for md in markdown_files:
              text = without_fences(md.read_text(encoding='utf-8'))
              targets = [m.group(1).strip() for m in inline.finditer(text)]
              targets += [m.group(1).strip() for m in reference.finditer(text)]
              for raw in targets:
                  if raw.startswith('<') and raw.endswith('>'):
                      raw = raw[1:-1].strip()
                  if not raw or raw.startswith('#') or raw.startswith('//') or raw.startswith(schemes):
                      continue
                  # Strip an optional Markdown title from ordinary link destinations.
                  if ' ' in raw and not raw.startswith(('"', "'")):
                      candidate = raw.split()[0]
                  else:
                      candidate = raw
                  candidate = candidate.split('#', 1)[0].split('?', 1)[0]
                  candidate = unquote(candidate)
                  if not candidate or candidate.startswith('/'):
                      continue
                  checked += 1
                  target = (md.parent / candidate).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      failures.append((md.relative_to(root), raw, 'escapes repository'))
                      continue
                  if not target.exists():
                      failures.append((md.relative_to(root), raw, 'missing target'))

          if failures:
              print(f'RELATIVE_LINK_CHECK=FAIL checked={checked} failures={len(failures)}')
              for source, raw, reason in failures:
                  print(f'{source}: {raw} [{reason}]')
              sys.exit(1)
          print(f'RELATIVE_LINK_CHECK=PASS checked={checked}')
          PY

      - name: Strict MkDocs build
        run: mkdocs build --strict
